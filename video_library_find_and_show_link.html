<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ভিডিও লাইব্রেরি</title>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6f8;font-family:Arial,sans-serif;color:#18202a}
header{padding:18px 15px;background:#111827;color:#fff}
header h1{margin:0;font-size:22px}
main{max-width:900px;margin:auto;padding:15px}
.filters{display:flex;gap:8px;overflow:auto;margin-bottom:15px}
.filters button{border:0;padding:10px 15px;border-radius:20px;background:#fff;white-space:nowrap;cursor:pointer}
.filters button.active{background:#111827;color:#fff}
#status{text-align:center;padding:25px;color:#667085}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px #00000010;cursor:pointer}
.thumb{width:100%;aspect-ratio:16/10;object-fit:cover;background:#ddd}
.info{padding:10px}
.title{font-size:15px;font-weight:700;line-height:1.35}
.meta{font-size:12px;color:#667085;margin-top:6px}

/* Link popup */
#linkBox{display:none;position:fixed;inset:0;background:#0009;z-index:99;align-items:center;justify-content:center;padding:18px}
.linkCard{width:100%;max-width:520px;background:#fff;border-radius:16px;padding:18px;box-shadow:0 10px 35px #0005}
.linkCard h2{margin:0 0 12px;font-size:19px}
#foundLink{width:100%;min-height:90px;border:1px solid #d0d5dd;border-radius:10px;padding:11px;resize:none;font-size:13px;line-height:1.5;word-break:break-all;background:#f8fafc}
.linkBtns{display:flex;gap:8px;margin-top:12px}
.linkBtns button{flex:1;border:0;padding:11px;border-radius:10px;cursor:pointer;font-weight:700}
.copyBtn{background:#111827;color:#fff}
.openBtn{background:#e5e7eb;color:#111827}
.closeBtn{margin-top:8px;width:100%;border:0;background:#fee2e2;color:#991b1b;padding:10px;border-radius:10px;cursor:pointer}

@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>

<body>
<header><h1>ভিডিও লাইব্রেরি</h1></header>

<main>
<div class="filters">
<button class="active" data-filter="all">সব ভিডিও</button>
<button data-filter="latest">লেটেস্ট</button>
<button data-filter="trending">ট্রেন্ডিং</button>
<button data-filter="popular">জনপ্রিয়</button>
</div>

<div id="status">ভিডিও লোড হচ্ছে...</div>
<div id="grid" class="grid"></div>
</main>

<div id="linkBox">
  <div class="linkCard">
    <h2>ভিডিও লিংক</h2>
    <textarea id="foundLink" readonly></textarea>
    <div class="linkBtns">
      <button class="copyBtn" onclick="copyLink()">লিংক কপি</button>
      <button class="openBtn" onclick="openFoundLink()">লিংক ওপেন</button>
    </div>
    <button class="closeBtn" onclick="closeLink()">বন্ধ করুন</button>
  </div>
</div>

<script>
const firebaseConfig={
apiKey:"AIzaSyBR9cx11EjwDzoCshY_8_j-pBix_brYA50",
authDomain:"ads-earning-26019.firebaseapp.com",
databaseURL:"https://ads-earning-26019-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId:"ads-earning-26019",
storageBucket:"ads-earning-26019.firebasestorage.app",
messagingSenderId:"226920017119",
appId:"1:226920017119:web:f9e5d2baac8cc86ab30d6a"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

let videos=[];
let filter="all";
let currentLink="";

/*
 Firebase document-এর বিভিন্ন জায়গা থেকে আসল ভিডিও লিংক খোঁজা:
 links / urls / parts / episodes / url / videoUrl / link / video_url
 */
function extractVideoLinks(data){
  let rawList=[];
  const src=data.links||data.urls||data.parts||data.episodes||
            data.url||data.videoUrl||data.link||data.video_url||"";

  if(typeof src==="string" && src.trim()){
    rawList=src.split(",").map(x=>x.trim()).filter(Boolean);
  }else if(Array.isArray(src)){
    src.forEach(item=>{
      if(typeof item==="string"){
        item.split(",").forEach(x=>{
          if(x.trim()) rawList.push(x.trim());
        });
      }else if(item && typeof item==="object"){
        const u=item.url||item.link||"";
        if(u.includes(",")){
          u.split(",").forEach(x=>{
            if(x.trim()) rawList.push({...item,url:x.trim()});
          });
        }else if(u.trim()){
          rawList.push(item);
        }
      }
    });
  }

  return rawList.map(item=>{
    if(typeof item==="string") return item.trim();
    return String(item.url||item.link||"").trim();
  }).filter(Boolean);
}

function getTime(v){
  const x=v.createdAt||v.timestamp||v.date;
  if(!x)return 0;
  if(x.seconds)return x.seconds*1000;
  const n=Number(x);
  return Number.isFinite(n)?n:(new Date(x).getTime()||0);
}

function findVideoLink(v){
  const links=extractVideoLinks(v);
  return links.length?links[0]:"";
}

function showVideoLink(v){
  const links=extractVideoLinks(v);

  if(!links.length){
    alert("এই ভিডিওর কোনো লিংক Firebase-এ পাওয়া যায়নি।");
    return;
  }

  /* ভিডিও প্লে হবে না। পাওয়া আসল লিংক দেখানো হবে। */
  currentLink=links[0];
  document.getElementById("foundLink").value=currentLink;
  document.getElementById("linkBox").style.display="flex";
}

function closeLink(){
  document.getElementById("linkBox").style.display="none";
  currentLink="";
}

async function copyLink(){
  if(!currentLink)return;
  try{
    await navigator.clipboard.writeText(currentLink);
    alert("ভিডিও লিংক কপি হয়েছে।");
  }catch(e){
    const box=document.getElementById("foundLink");
    box.select();
    document.execCommand("copy");
    alert("ভিডিও লিংক কপি হয়েছে।");
  }
}

function openFoundLink(){
  if(currentLink) window.open(currentLink,"_blank");
}

function render(){
  let list=[...videos];

  if(filter==="latest"){
    list.sort((a,b)=>getTime(b)-getTime(a));
  }else if(filter==="trending"){
    list.sort((a,b)=>(Number(b.views)||0)-(Number(a.views)||0));
  }else if(filter==="popular"){
    list.sort((a,b)=>(Number(b.likes)||0)-(Number(a.likes)||0));
  }else{
    list.sort((a,b)=>getTime(b)-getTime(a));
  }

  const grid=document.getElementById("grid");
  grid.innerHTML="";

  if(!list.length){
    document.getElementById("status").textContent="কোনো ভিডিও পাওয়া যায়নি।";
    return;
  }

  document.getElementById("status").textContent="";

  list.forEach(v=>{
    const card=document.createElement("div");
    card.className="card";

    const img=document.createElement("img");
    img.className="thumb";
    img.loading="lazy";
    img.src=v.thumb||v.thumbnail||v.poster||"";
    img.onerror=()=>img.style.visibility="hidden";

    const info=document.createElement("div");
    info.className="info";

    const title=document.createElement("div");
    title.className="title";
    title.textContent=v.title||v.name||"ভিডিও";

    const meta=document.createElement("div");
    meta.className="meta";
    meta.textContent=(Number(v.views)||0)+" views";

    info.append(title,meta);
    card.append(img,info);

    /*
      কার্ডে ক্লিক করলে ভিডিও লোড হবে না।
      Firebase document থেকে ভিডিও লিংক খুঁজে popup-এ দেখাবে।
    */
    card.onclick=()=>showVideoLink(v);

    grid.appendChild(card);
  });
}

document.querySelectorAll(".filters button").forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll(".filters button")
      .forEach(x=>x.classList.remove("active"));
    btn.classList.add("active");
    filter=btn.dataset.filter;
    render();
  };
});

db.collection("videos").onSnapshot(snapshot=>{
  videos=snapshot.docs.map(doc=>({
    id:doc.id,
    ...doc.data()
  }));
  render();
},error=>{
  document.getElementById("status").textContent=
    "ডাটাবেস থেকে ভিডিও লোড করা যায়নি।";
  console.error(error);
});
</script>
</body>
</html>
